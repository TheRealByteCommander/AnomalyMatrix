# Production overlay — use:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  api:
    env_file:
      - .env.production
    environment:
      ANOMALYMATRIX_ENV: prod
      RBAC_ENFORCE: "true"
      LICENSE_ENFORCE: "true"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ANOMALYMATRIX_INFERENCE_PROVIDER: ${ANOMALYMATRIX_INFERENCE_PROVIDER:-patchcore}
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      LICENSE_ADMIN_TOKEN: ${LICENSE_ADMIN_TOKEN}
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-}
      LICENSE_PRODUCT_ID: ${LICENSE_PRODUCT_ID:-}
      LICENSE_DEVICE_ID: ${LICENSE_DEVICE_ID:-}
      LICENSE_ALLOW_LOCAL_KEYS: ${LICENSE_ALLOW_LOCAL_KEYS:-false}
      LICENSE_OFFLINE_GRACE_HOURS: ${LICENSE_OFFLINE_GRACE_HOURS:-72}
      LICENSE_VALIDATE_INTERVAL_SEC: ${LICENSE_VALIDATE_INTERVAL_SEC:-300}
      AMX_CORS_ORIGINS: ${AMX_CORS_ORIGINS}
      AMX_ADMIN_PASSWORD: ${AMX_ADMIN_PASSWORD}
      EDGE_ACQUISITION_URL: http://edge-acquisition:8091
      OPCUA_GATEWAY_URL: http://opcua-gateway:8092
      MINIO_PUBLIC_BASE: ${MINIO_PUBLIC_BASE:-/artifacts}
      CAMERA_DRIVER: ${CAMERA_DRIVER:-synthetic}
      CAMERA_SOURCE: ${CAMERA_SOURCE:-0}
    volumes:
      - api_data:/app/data
    # API only on localhost — HMI reaches it via nginx proxy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api/v1
        VITE_REQUIRE_AUTH: "true"
        VITE_DEV_AUTH_HEADERS: "false"
        ANOMALYMATRIX_VERSION: ${ANOMALYMATRIX_VERSION:-1.1.0}
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 256m
    restart: unless-stopped

  edge-acquisition:
    environment:
      ANOMALYMATRIX_ENV: prod
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN}
      CAMERA_DRIVER: ${CAMERA_DRIVER:-synthetic}
      CAMERA_SOURCE: ${CAMERA_SOURCE:-0}
    restart: unless-stopped

  opcua-gateway:
    environment:
      ANOMALYMATRIX_ENV: prod
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN}
      OPCUA_SECURITY_ENABLED: "true"
      OPCUA_CERT_DIR: /app/certs
      OPCUA_API_KEY: ${OPCUA_API_KEY}
      ANOMALYMATRIX_API_URL: http://api:8080
    volumes:
      - opcua_certs:/app/certs
    ports:
      - "4840:4840"
    restart: unless-stopped

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped

  influxdb:
    environment:
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    restart: unless-stopped

  minio:
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: unless-stopped

volumes:
  opcua_certs:
  api_data:
