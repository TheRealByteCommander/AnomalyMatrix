name: CI

on:
  push:
    branches: ["master", "feature/**", "cursor/**"]
  pull_request:
    branches: ["master"]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ../opcua-gateway/requirements.txt
          pip install pip-audit
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Lint skeleton (compile)
        run: python -m compileall app
      - name: Run tests (provider matrix + gates)
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          ANOMALYMATRIX_INFERENCE_PROVIDER=stub pytest -q
          ANOMALYMATRIX_INFERENCE_PROVIDER=opencv_ready pytest -q
          ANOMALYMATRIX_INFERENCE_PROVIDER=patchcore pytest -q

  frontend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, audit and build
        run: |
          npm ci --legacy-peer-deps
          npm audit --audit-level=high
          npm run smoke

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright and deps
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: npm run test:e2e

  production-guards:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Production + RBAC + security tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          pytest -q tests/test_production_guards.py tests/test_load.py tests/test_security_hardening.py
          ANOMALYMATRIX_ENV=prod RBAC_ENFORCE=true pytest -q tests/test_production_guards.py::test_production_requires_auth_header
