name: CI

on:
  push:
    branches: ["master", "feature/**", "cursor/**"]
  pull_request:
    branches: ["master"]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ../opcua-gateway/requirements.txt
          pip install pip-audit
      - name: Dependency audit (all Python services)
        run: |
          pip-audit -r requirements.txt
          pip-audit -r ../opcua-gateway/requirements.txt
          pip-audit -r ../edge-acquisition/requirements.txt
      - name: Lint skeleton (compile)
        run: python -m compileall app
      - name: Run tests (provider matrix + gates)
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          ANOMALYMATRIX_INFERENCE_PROVIDER=stub pytest -q
          ANOMALYMATRIX_INFERENCE_PROVIDER=opencv_ready pytest -q
          ANOMALYMATRIX_INFERENCE_PROVIDER=patchcore pytest -q

  frontend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, audit and build
        run: |
          npm ci --legacy-peer-deps
          npm audit --audit-level=high
          npm run smoke

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright and deps
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: npm run test:e2e

  production-guards:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Production + RBAC + security tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          pytest -q tests/test_production_guards.py tests/test_load.py tests/test_security_hardening.py tests/test_post_merge_hardening.py tests/test_readiness.py
          ANOMALYMATRIX_ENV=prod RBAC_ENFORCE=true pytest -q tests/test_production_guards.py::test_production_requires_auth_header

  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        run: |
          # Compose overlays reference env files that are gitignored.
          cp .env.example .env
          cp .env.production.example .env.production
          # Replace placeholders so compose config accepts values
          sed -i 's/REPLACE_[A-Z0-9_]*/ci-placeholder-value-with-enough-length/g' .env.production
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.camera.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.tls.yml config >/dev/null
      - name: Build API image
        run: docker build -f backend/Dockerfile --build-arg ANOMALYMATRIX_VERSION=1.1.0 -t amx-api:ci .
      - name: Build edge image
        run: docker build -f edge-acquisition/Dockerfile --build-arg ANOMALYMATRIX_VERSION=1.1.0 -t amx-edge:ci ./edge-acquisition
      - name: Build OPC-UA gateway image
        run: docker build -f opcua-gateway/Dockerfile --build-arg ANOMALYMATRIX_VERSION=1.1.0 -t amx-opcua:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t amx-frontend:ci ./frontend
